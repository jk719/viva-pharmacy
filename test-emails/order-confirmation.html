        // Function to update the email preview
        function updatePreview(isDarkMode) {
            const container = document.getElementById('email-container');
            container.innerHTML = '';
            
            // Create iframe to isolate email styles
            const iframe = document.createElement('iframe');
            container.appendChild(iframe);
            
            // Add dark mode class to the iframe if needed
            iframe.onload = function() {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const htmlTag = iframeDoc.querySelector('html');
                
                // Apply dark mode through data attribute for testing
                if (isDarkMode) {
                    htmlTag.setAttribute('data-color-scheme', 'dark');
                    
                    // Also add a class to the html element to help with testing
                    htmlTag.classList.add('dark-mode');
                    
                    // Add forced dark mode styles
                    const style = iframeDoc.createElement('style');
                    style.textContent = `
                        @media (prefers-color-scheme: dark) {
                            :root {
                                color-scheme: dark;
                            }
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                } else {
                    htmlTag.removeAttribute('data-color-scheme');
                    htmlTag.classList.remove('dark-mode');
                }
            };
            
            // Write the email content to the iframe
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(emailHtml);
            iframeDoc.close();
        }
        
        // Initialize with light mode
        updatePreview(false);
        
        // Handle dark mode toggle
        const toggle = document.getElementById('dark-mode-toggle');
        toggle.addEventListener('change', function() {
            updatePreview(this.checked);
        });
