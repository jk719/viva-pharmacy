
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Welcome - Email Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .dark-mode {
            background-color: #222;
            color: #eee;
        }
        iframe {
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            background: #FF9F43;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #e58b2f;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #FF9F43;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="controls">
        <h1>Admin Welcome Template Test</h1>
        <div class="theme-toggle">
            <span>Light Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="slider"></span>
            </label>
            <span>Dark Mode</span>
        </div>
        <p>Viewing the email template with mock data. Use the toggle above to test dark mode support.</p>
    </div>
    
    <div id="email-container"></div>
    
    <script>
        // Store the email HTML content
        const emailHtml = `
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Welcome to Viva Pharmacy Admin</title>
        <meta name="color-scheme" content="light dark">
        <meta name="supported-color-schemes" content="light dark">
        <style>
          :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
            --primary-color: #FF9F43;
            --primary-dark: #E58B2F;
            --text-color: #333333;
            --text-light: #666666;
            --text-on-primary: #FFFFFF;
            --warning-color: #d63031;
            --warning-color-dark: #ff4d4f;
            --bg-color: #FFFFFF;
            --bg-secondary: #F9F9F9;
            --bg-credentials: #f5f5f5;
            --border-color: #EEEEEE;
            --shadow-color: rgba(0,0,0,0.1);
          }

          @media (prefers-color-scheme: dark) {
            :root {
              --primary-color: #FF9F43;
              --primary-dark: #FFA857;
              --text-color: #F0F0F0;
              --text-light: #B0B0B0;
              --text-on-primary: #FFFFFF;
              --warning-color: #ff6b6b;
              --warning-color-dark: #ff8585;
              --bg-color: #1A1A1A;
              --bg-secondary: #2A2A2A;
              --bg-credentials: #2D2D2D;
              --border-color: #444444;
              --shadow-color: rgba(0,0,0,0.3);
            }
          }
          
          body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
          }
          .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
          }
          .header {
            text-align: center;
            padding: 20px 0;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            border-radius: 8px;
            margin-bottom: 20px;
          }
          .content {
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow-color);
            border: 1px solid var(--border-color);
          }
          .credentials {
            background-color: var(--bg-credentials);
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border: 1px solid var(--border-color);
          }
          .warning {
            color: var(--warning-color);
            font-weight: bold;
          }
          .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
          }
          .steps {
            background-color: var(--bg-secondary);
            padding: 15px 20px;
            border-radius: 6px;
            margin: 20px 0;
            border: 1px solid var(--border-color);
          }
          .step {
            margin-bottom: 10px;
          }
          .step-number {
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            padding: 2px 8px;
            border-radius: 50%;
            margin-right: 8px;
            font-size: 14px;
          }
          /* Email client-specific adjustments */
          [data-ogsc] .header { background-color: var(--primary-color) !important; }
          [data-ogsc] .content { background-color: var(--bg-color) !important; }
          [data-ogsc] .steps { background-color: var(--bg-secondary) !important; }
          [data-ogsc] .credentials { background-color: var(--bg-credentials) !important; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>Welcome to Viva Pharmacy Admin</h1>
          </div>

          <div class="content">
            <p>Hello,</p>
            <p>You have been invited to join Viva Pharmacy's management system as a Manager.</p>

            <div class="steps">
              <p><strong>Please follow these steps to get started:</strong></p>
              <p class="step">
                <span class="step-number">1</span>
                Click the verification button below to verify your email
              </p>
              <p class="step">
                <span class="step-number">2</span>
                After verification, you'll be prompted to set your password
              </p>
              <p class="step">
                <span class="step-number">3</span>
                Use your email and password to access the management portal
              </p>
            </div>

            <div style="text-align: center;">
              <a href="http://localhost:3000/verify-email?token=xyz987654321" class="button">
                Verify Email &amp; Set Password
              </a>
            </div>

            <p class="warning">
              Important: This verification link will expire in 24 hours.
              Please complete the verification process as soon as possible.
            </p>

            <p>If you have any questions or issues, please contact the system administrator.</p>

            <p style="margin-top: 30px;">
              Best regards,<br>
              Viva Pharmacy Team
            </p>
          </div>
        </div>
      </body>
    </html>
  `;
        
        // Function to update the email preview
        function updatePreview(isDarkMode) {
            const container = document.getElementById('email-container');
            container.innerHTML = '';
            
            // Create iframe to isolate email styles
            const iframe = document.createElement('iframe');
            container.appendChild(iframe);
            
            // Add dark mode class to the iframe if needed
            iframe.onload = function() {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const htmlTag = iframeDoc.querySelector('html');
                
                // Apply dark mode through data attribute for testing
                if (isDarkMode) {
                    htmlTag.setAttribute('data-color-scheme', 'dark');
                    
                    // Also add a class to the html element to help with testing
                    htmlTag.classList.add('dark-mode');
                    
                    // Add forced dark mode styles
                    const style = iframeDoc.createElement('style');
                    style.textContent = `
                        @media (prefers-color-scheme: dark) {
                            :root {
                                color-scheme: dark;
                            }
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                } else {
                    htmlTag.removeAttribute('data-color-scheme');
                    htmlTag.classList.remove('dark-mode');
                }
            };
            
            // Write the email content to the iframe
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(emailHtml);
            iframeDoc.close();
        }
        
        // Initialize with light mode
        updatePreview(false);
        
        // Handle dark mode toggle
        const toggle = document.getElementById('dark-mode-toggle');
        toggle.addEventListener('change', function() {
            updatePreview(this.checked);
        });
    </script>
</body>
</html>
