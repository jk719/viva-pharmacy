
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Email Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .dark-mode {
            background-color: #222;
            color: #eee;
        }
        iframe {
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            background: #FF9F43;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #e58b2f;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #FF9F43;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="controls">
        <h1>Password Reset Template Test</h1>
        <div class="theme-toggle">
            <span>Light Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="slider"></span>
            </label>
            <span>Dark Mode</span>
        </div>
        <p>Viewing the email template with mock data. Use the toggle above to test dark mode support.</p>
    </div>
    
    <div id="email-container"></div>
    
    <script>
        // Store the email HTML content
        const emailHtml = `
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <meta name="supported-color-schemes" content="light dark">
        <title>Reset Your Password - Viva Pharmacy</title>
        <style>
          :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
            --primary-color: #FF9F43;
            --primary-dark: #E58B2F;
            --text-color: #333333;
            --text-light: #666666;
            --text-on-primary: #FFFFFF;
            --bg-color: #FFFFFF;
            --bg-secondary: #F9F9F9;
            --border-color: #EEEEEE;
            --shadow-color: rgba(0,0,0,0.1);
          }

          @media (prefers-color-scheme: dark) {
            :root {
              --primary-color: #FF9F43;
              --primary-dark: #FFA857;
              --text-color: #F0F0F0;
              --text-light: #B0B0B0;
              --text-on-primary: #FFFFFF;
              --bg-color: #1A1A1A;
              --bg-secondary: #2A2A2A;
              --border-color: #444444;
              --shadow-color: rgba(0,0,0,0.3);
            }
          }
          
          body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
          }
          .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
          }
          .header {
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
          }
          .content {
            background-color: var(--bg-color);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 4px var(--shadow-color);
          }
          .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
            font-weight: bold;
          }
          .footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            font-size: 0.9em;
          }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>Reset Your Password</h1>
          </div>
          <div class="content">
            <p>Hello John Doe,</p>
            <p>We received a request to reset your password for your Viva Pharmacy account.</p>
            <p>Please click the button below to reset your password:</p>
            <div style="text-align: center;">
              <a href="http://localhost:3000/reset-password?token=abcdef123456" class="button">
                Reset Password
              </a>
            </div>
            <p>Or copy and paste this link into your browser:</p>
            <p>http://localhost:3000/reset-password?token=abcdef123456</p>
            <p>This link will expire in 1 hour.</p>
            <p>If you did not request this reset, please ignore this email.</p>
          </div>
          <div class="footer">
            <p>This is an automated message from Viva Pharmacy. Please do not reply to this email.</p>
          </div>
        </div>
      </body>
    </html>
  `;
        
        // Function to update the email preview
        function updatePreview(isDarkMode) {
            const container = document.getElementById('email-container');
            container.innerHTML = '';
            
            // Create iframe to isolate email styles
            const iframe = document.createElement('iframe');
            container.appendChild(iframe);
            
            // Add dark mode class to the iframe if needed
            iframe.onload = function() {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const htmlTag = iframeDoc.querySelector('html');
                
                // Apply dark mode through data attribute for testing
                if (isDarkMode) {
                    htmlTag.setAttribute('data-color-scheme', 'dark');
                    
                    // Also add a class to the html element to help with testing
                    htmlTag.classList.add('dark-mode');
                    
                    // Add forced dark mode styles
                    const style = iframeDoc.createElement('style');
                    style.textContent = `
                        @media (prefers-color-scheme: dark) {
                            :root {
                                color-scheme: dark;
                            }
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                } else {
                    htmlTag.removeAttribute('data-color-scheme');
                    htmlTag.classList.remove('dark-mode');
                }
            };
            
            // Write the email content to the iframe
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(emailHtml);
            iframeDoc.close();
        }
        
        // Initialize with light mode
        updatePreview(false);
        
        // Handle dark mode toggle
        const toggle = document.getElementById('dark-mode-toggle');
        toggle.addEventListener('change', function() {
            updatePreview(this.checked);
        });
    </script>
</body>
</html>
